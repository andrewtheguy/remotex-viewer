[package]
name = "remotex-viewer"
version.workspace = true
edition = "2024"
publish = false

# The gateway's page in a window of its own, on Windows and macOS; Linux is out of
# scope, so there the binary only says so. Built with Tauri's own window and web
# view crates (tao, wry) and arboard, the clipboard crate Tauri's clipboard plugin
# uses, rather than Tauri itself: there is one window showing a remote page, and
# nothing here needs Tauri's commands, bundler or configuration.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
serde_json = "1"
tao = "0.37"
wry = "0.57"

# WebView2 decodes no HEVC 4:4:4, so on Windows the page's HEVC goes to FFmpeg's
# decoder in this process — the same one the gateway links for `apple-hp-media`.
[target.'cfg(windows)'.dependencies]
avcodec-hevc-sys = { package = "libavcodec-hevc-prebuilt-sys", git = "https://github.com/andrewtheguy/libavcodec-hevc-prebuilt", tag = "v9.0.2-20260928041244-5fdbab1" }
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
